name: Keep hosted MeshCentral warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request the public health page
        run: >-
          curl --fail --silent --show-error --location
          --max-time 120 --retry 2 --retry-delay 5 --output /dev/null
          https://meshcentral-global.onrender.com/
